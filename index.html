```html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JeabJeab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #fff7cc,
        #ffe58f,
        #ffd666,
        #ffc53d
    );
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
}

/* Background Glow */

body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
}

body::before{
    width:350px;
    height:350px;
    background:rgba(255,255,255,.45);
    top:-120px;
    left:-80px;
}

body::after{
    width:300px;
    height:300px;
    background:rgba(255,190,11,.35);
    bottom:-100px;
    right:-50px;
}

@keyframes bgMove{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

/* Main Card */

.card{
    position:relative;
    z-index:2;

    width:90%;
    max-width:460px;

    padding:40px 30px;

    border-radius:32px;

    background:rgba(255,255,255,.22);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.35);

    box-shadow:
        0 20px 50px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.5);

    text-align:center;

    animation:fadeUp 1s ease;
}

.logo{
    width:140px;
    height:140px;

    object-fit:cover;

    border-radius:50%;

    border:4px solid rgba(255,255,255,.75);

    box-shadow:
        0 0 25px rgba(255,255,255,.8),
        0 0 50px rgba(255,196,0,.5);

    animation:float 4s ease-in-out infinite;
}

h1{
    margin-top:22px;
    font-size:2.7rem;
    font-weight:800;
    color:#3f2c00;
}

.tagline{
    margin-top:8px;
    font-size:1rem;
    color:#6b4e00;
    line-height:1.6;
}

.highlight{
    font-weight:700;
    color:#b56b00;
}

.buttons{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.btn{
    text-decoration:none;
    color:white;

    padding:15px 20px;

    border-radius:18px;

    font-weight:600;

    transition:.35s;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.btn:hover{
    transform:translateY(-4px) scale(1.02);
}

.facebook{
    background:linear-gradient(
        135deg,
        #1877f2,
        #5590f5
    );
    box-shadow:0 10px 25px rgba(24,119,242,.35);
}

.instagram{
    background:linear-gradient(
        135deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf
    );
    box-shadow:0 10px 25px rgba(214,41,118,.35);
}

.roblox{
    background:linear-gradient(
        135deg,
        #ff4d4f,
        #ff7875
    );
    box-shadow:0 10px 25px rgba(255,77,79,.35);
}

.support{
    margin-top:28px;
    font-size:1.1rem;
    font-weight:700;
    color:#a65a00;
}

.footer{
    margin-top:25px;
    font-size:.85rem;
    color:#856404;
    opacity:.8;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-10px);
    }
}

@media(max-width:500px){

    .card{
        padding:30px 22px;
    }

    h1{
        font-size:2.2rem;
    }

    .logo{
        width:120px;
        height:120px;
    }
}

</style>
</head>

<body>

<div class="card">

    <img src="Jeablogo.png" alt="JeabJeab Logo" class="logo">

    <h1>JeabJeab</h1>

    <p class="tagline">
        Hard work turns
        <span class="highlight">Destiny</span>
        into achievement.
    </p>

    <div class="buttons">

        <a href="https://www.facebook.com/kannoooonnn/" target="_blank" class="btn facebook">
            📘 Facebook
        </a>

        <a href="https://www.instagram.com/n2xxn__/" target="_blank" class="btn instagram">
            📸 Instagram
        </a>

    </div>

    <div class="support">
        Support Me 💕
    </div>

    <div class="buttons">

        <a href="https://www.roblox.com/catalog/78561911471928/JeabJeab-Shirt" target="_blank" class="btn roblox">
            👕 My Shirt
        </a>

        <a href="https://www.roblox.com/catalog/132352056031004/JeabJeab-Pants" target="_blank" class="btn roblox">
            👖 My Pants
        </a>

    </div>

    <div class="footer">
        © 2026 JeabJeab
    </div>

</div>

</body>
</html>
